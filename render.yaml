services:
  - type: web
    name: restaurant-ordering-demo
    runtime: python
    rootDir: .
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python create_superuser.py && python manage.py seed_data"
    startCommand: "python manage.py migrate && python create_superuser.py && python manage.py seed_data && gunicorn dimpu.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WEB_CONCURRENCY
        value: 2
